html,body{width:1920px;height:1080px;overflow:hidden;background:#0b0b0c;color:#f5f3ee;font-family:"Space Grotesk",system-ui,sans-serif}

/* timed entrance: --s is the start time in seconds, --d the duration */
.a{animation-duration:calc(var(--d,.9)*1s);animation-delay:calc((var(--s) - var(--t))*1s);animation-fill-mode:both;animation-play-state:paused;animation-timing-function:cubic-bezier(.22,1,.36,1)}
.rise{animation-name:rise}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}.drop{animation-name:drop}.wipe{animation-name:wipe}.zoom{animation-name:zoom;animation-timing-function:linear}
